<!-- title: Count Cards -->
<div id="statusRow"></div>
<div class="stolon-cards stolon-compact" style="--stolon-balance-max: 4">
    <div class="stolon-card stolon-pink"><span class="stolon-card-count">4</span><span class="stolon-card-label">Pink</span></div>
    <div class="stolon-card stolon-teal"><span class="stolon-card-count">9</span><span class="stolon-card-label">Teal</span></div>
    <div class="stolon-card stolon-yellow"><span class="stolon-card-count">2</span><span class="stolon-card-label">Yellow</span></div>
    <div class="stolon-card stolon-blue"><span class="stolon-card-count">6</span><span class="stolon-card-label">Blue</span></div>
    <div class="stolon-card stolon-gray"><span class="stolon-card-count">1</span><span class="stolon-card-label">Gray</span></div>
</div>
<div class="stolon-cards stolon-words stolon-balanced" style="margin-top: 24px;">
    <div class="stolon-card stolon-green"><span class="stolon-card-count">Running</span><span class="stolon-card-label">Server</span></div>
    <div class="stolon-card stolon-orange"><span class="stolon-card-count">Points elsewhere</span><span class="stolon-card-label">DNS record</span></div>
    <div class="stolon-card stolon-blue"><span class="stolon-card-count">Signed in</span><span class="stolon-card-label">Account</span></div>
</div>
<script type="module">
const base = await window.__baseReady;
const shared = base.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');
base.bindBalancedRows(document.getElementById('view'));
shared.renderCards('statusRow', [
    { label: 'Queued', count: 12, color: 'orange' },
    { label: 'Synced', count: 340, color: 'green' },
    { label: 'Errored', count: 3, color: 'red' },
    { label: 'Pending', count: 21, color: 'purple' },
    { label: 'Ignored', count: 8, color: 'gray' }
]);
</script>
