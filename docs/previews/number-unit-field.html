<!-- title: Number Unit Field -->
<div id="mount"></div>
<script type="module">
const base = await window.__baseReady;
const mount = document.getElementById('mount');
mount.appendChild(base.createNumberUnitField({ units: [{ value: 'MB', factor: 1 }, { value: 'GB', factor: 1024 }], value: 512, unit: 'MB', min: 1, max: 4096 }).element);
const labelled = base.createNumberUnitField({ label: 'Cache size', help: 'The most the cache holds before old files go.', units: [{ value: 'MB', factor: 1 }, { value: 'GB', factor: 1024 }], value: 2, unit: 'GB', min: 1 });
labelled.element.style.marginTop = '16px';
mount.appendChild(labelled.element);
</script>
