<!-- title: Unsaved Indicator -->
<h3 style="margin: 0 0 12px;">Settings <span class="stolon-unsaved" id="indicator"><span class="stolon-unsaved-dot"></span>Unsaved changes</span></h3>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
    <button type="button" id="btnShow" class="raised stolon-button stolon-small"><span>Show</span></button>
    <button type="button" id="btnHide" class="raised stolon-button stolon-secondary stolon-small"><span>Hide</span></button>
    <button type="button" id="btnSaved" class="raised stolon-button stolon-secondary stolon-small"><span>Saved Look</span></button>
</div>
<script type="module">
await window.__baseReady;
const indicator = document.getElementById('indicator');
document.getElementById('btnShow').addEventListener('click', () => indicator.classList.add('stolon-visible'));
document.getElementById('btnHide').addEventListener('click', () => indicator.classList.remove('stolon-visible', 'stolon-save-success'));
document.getElementById('btnSaved').addEventListener('click', () => indicator.classList.add('stolon-visible', 'stolon-save-success'));
indicator.classList.add('stolon-visible');
</script>
