<!-- title: Sortable Card List -->
<div id="serverList" class="stolon-card-list"></div>
<div class="stolon-card-list-actions">
    <button is="emby-button" type="button" class="raised stolon-button stolon-primary">
        <span class="material-icons" aria-hidden="true">add</span><span>Add Server</span>
    </button>
</div>
<span id="orderStatus" class="stolon-status-text"></span>
<div id="editorHolder" class="stolon-hidden">
    <div id="serverEditor">
        <div class="inputContainer"><label for="txtEditName">Name</label><input is="emby-input" type="text" id="txtEditName" value="Edited in place" /></div>
    </div>
</div>
<h3 class="stolon-subsection-title">Steps with icon tiles</h3>
<div id="stepList" class="stolon-card-list"></div>
<script type="module">
const base = await window.__baseReady;
const shared = base.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');
const servers = [
    { name: 'Living room', url: 'http://living:8096', mode: 'Both', dot: 'ok' },
    { name: 'Cabin', url: 'http://cabin:8096', mode: 'Pull', dot: 'bad' },
    { name: 'Backup', url: 'http://backup:8096', mode: 'Push', dot: 'checking', disabled: true }
];
const colors = { Both: 'purple', Pull: 'green', Push: 'blue' };
const cards = base.createSortableCardList(document.getElementById('serverList'), {
    items: servers,
    editor: document.getElementById('serverEditor'),
    render: (server) => ({
        title: server.name,
        subtitle: server.url,
        dot: server.dot,
        disabled: server.disabled,
        badges: [{ label: server.mode, cls: colors[server.mode] }]
    }),
    onMove: (from, to) => shared.setStatus('orderStatus', 'Moved ' + (from + 1) + ' to ' + (to + 1) + '.', false, { timeout: 0 })
});
cards.setSelected(0);
const steps = [
    { icon: 'notifications', color: 'blue', title: 'Send a notification', subtitle: 'To every admin' },
    { icon: 'schedule', color: 'gray', title: 'Wait', subtitle: '5 minutes' },
    { icon: 'terminal', title: 'Run a command', subtitle: 'curl -X POST http://hooks.local/refresh-library-with-a-long-address' }
];
base.createSortableCardList(document.getElementById('stepList'), {
    items: steps,
    render: (step) => ({ icon: step.icon, iconColor: step.color, title: step.title, subtitle: step.subtitle })
}).render();
</script>
