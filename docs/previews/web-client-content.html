<!-- title: Web Client Content Style -->
<p>Author content in a frame with the web client content style, as WebClientContentStyle.Inject puts it in. The preview has no web client fonts, so the text takes the font stack from the browser.</p>
<iframe id="page" title="Web client content style" style="display: block; width: 100%; height: 420px; border: 0; border-radius: 8px;"></iframe>
<script type="module">
await window.__baseReady;
const style = (await (await fetch('./base/webclient-content.html')).text()).replace('{{FONTS}}', '');
const doc = '<!DOCTYPE html><html><head><title>Hours</title></head><body>'
    + '<h1>Opening hours</h1><p>The server is up all day. Read the <a href="#">house rules</a> first.</p>'
    + '<h2>Times</h2><table><tr><th>Day</th><th>Hours</th></tr><tr><td>Weekdays</td><td>All day</td></tr><tr><td>Weekends</td><td>All day</td></tr></table>'
    + '<p><input placeholder="Your name"></p><button type="button">Cancel</button> <button type="submit">Send</button></body></html>';
document.getElementById('page').srcdoc = doc.replace('<head>', '<head>' + style);
</script>
