<!-- title: Design Tokens -->
<div id="mount"></div>
<script type="module">
await window.__baseReady;
const swatch = (token, name) =>
    '<div style="width: 92px; text-align: center; font-size: 0.7rem;">' +
    '<div style="height: 40px; border-radius: 8px; border: 1px solid var(--stolon-border); background: var(' + token + ');"></div>' + name + '</div>';
const row = (tokens) => '<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;">' +
    tokens.map((t) => swatch(t[0], t[1])).join('') + '</div>';
document.getElementById('mount').innerHTML =
    row([['--stolon-accent', 'accent'], ['--stolon-accent-hover', 'accent-hover'], ['--stolon-surface', 'surface'], ['--stolon-border', 'border'],
         ['--stolon-accent-wash', 'accent-wash'], ['--stolon-wash', 'wash'], ['--stolon-wash-strong', 'wash-strong']]) +
    row([['--stolon-success', 'success'], ['--stolon-warning', 'warning'], ['--stolon-error', 'error'], ['--stolon-error-hover', 'error-hover']]) +
    row(['green', 'red', 'orange', 'purple', 'blue', 'gray', 'yellow', 'pink', 'teal'].map((c) => ['--stolon-' + c + '-bg', c + ' bg'])) +
    row(['green', 'red', 'orange', 'purple', 'blue', 'gray', 'yellow', 'pink', 'teal'].map((c) => ['--stolon-' + c + '-fg', c + ' fg']));
</script>
