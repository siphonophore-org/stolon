<!-- title: Button -->
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
    <button is="emby-button" type="button" class="raised stolon-button stolon-primary"><span>Save</span></button>
    <button is="emby-button" type="button" class="raised stolon-button stolon-destructive"><span>Remove</span></button>
    <button is="emby-button" type="button" class="raised stolon-button stolon-secondary"><span>Cancel</span></button>
    <button is="emby-button" type="button" class="raised stolon-button stolon-primary stolon-small"><span>Small</span></button>
    <button is="emby-button" type="button" class="raised stolon-button stolon-primary">
        <span class="material-icons" aria-hidden="true">add</span><span>Add Server</span>
    </button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px;">
    <button is="emby-button" type="button" class="raised stolon-button stolon-primary stolon-small stolon-icon-only" title="Queue" aria-label="Queue"><span class="material-icons" aria-hidden="true">playlist_add</span></button>
    <button is="emby-button" type="button" class="raised stolon-button stolon-secondary stolon-small stolon-icon-only" title="Ignore" aria-label="Ignore"><span class="material-icons" aria-hidden="true">block</span></button>
    <button is="emby-button" type="button" class="raised stolon-button stolon-secondary stolon-icon-only" title="Refresh" aria-label="Refresh"><span class="material-icons" aria-hidden="true">refresh</span></button>
</div>
<div class="stolon-button-row" style="margin-top: 12px;">
    <button is="emby-button" type="button" class="raised stolon-button stolon-secondary stolon-fill"><span>Cancel</span></button>
    <button is="emby-button" type="button" class="raised stolon-button stolon-primary stolon-fill stolon-hidden"><span>Retry errors</span></button>
    <button is="emby-button" type="button" class="raised stolon-button stolon-primary stolon-fill"><span>Save</span></button>
</div>
