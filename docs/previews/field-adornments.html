<!-- title: Field Adornments -->
<div class="stolon-field"><label for="numPort">Port</label><input type="number" id="numPort" value="8096" min="1" max="65535" /></div>
<div class="stolon-edit-line" style="margin-top: 16px;">
    <div class="stolon-field"><label for="dateFrom">From</label><input type="date" id="dateFrom" value="2026-03-10" /></div>
    <div class="stolon-field"><label for="dateTo">To</label><input type="date" id="dateTo" value="2026-03-11" /></div>
    <div class="stolon-field"><label for="timeAt">At</label><input type="time" id="timeAt" value="03:00" /></div>
</div>
<div class="stolon-edit-line" style="margin-top: 16px;">
    <div class="stolon-field"><label for="txtSubdomain">Subdomain</label><input type="text" id="txtSubdomain" value="media" data-stolon-suffix=".example.com" /></div>
    <div class="stolon-field"><label for="txtSite">Site</label><input type="text" id="txtSite" placeholder="example.com" data-stolon-prefix="https://" /></div>
</div>
