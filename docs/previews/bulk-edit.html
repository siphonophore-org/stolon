<!-- title: Bulk Edit Bar and Edit Row -->
<div class="stolon-bulk-edit-bar">
    <div class="stolon-bulk-edit-title">Bulk edit, 3 selected</div>
    <div class="stolon-edit-line">
        <div class="stolon-field"><label for="txtArtist">Artist</label><input type="text" id="txtArtist" placeholder="Set artist" /></div>
        <div class="stolon-field"><label for="txtAlbum">Album</label><input type="text" id="txtAlbum" placeholder="Set album" /></div>
        <span class="stolon-edit-secondary">2.34 MB</span>
        <button type="button" class="raised stolon-button stolon-primary stolon-field" style="margin-left: auto;">Apply</button>
    </div>
</div>
<div class="stolon-table-body">
    <div class="stolon-table-row stolon-edit-row">
        <div class="stolon-edit-line">
            <div class="stolon-field"><label for="txtTitle">Title</label><input type="text" id="txtTitle" value="Track one" /></div>
            <span class="stolon-edit-secondary">3:42</span>
        </div>
    </div>
</div>
