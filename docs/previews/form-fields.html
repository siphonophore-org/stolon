<!-- title: Form Fields -->
<div class="inputContainer">
    <label for="txtServerName">Name</label>
    <input is="emby-input" type="text" id="txtServerName" placeholder="Default" />
    <div class="fieldDescription">Names the server in tables and logs.</div>
</div>
<div class="selectContainer">
    <label for="selMode">Mode</label>
    <select is="emby-select" id="selMode">
        <option value="Allow">Allowlist</option>
        <option value="Block">Blocklist</option>
    </select>
</div>
<div class="inputContainer">
    <label for="txtNotes">Notes</label>
    <textarea is="emby-textarea" id="txtNotes" rows="2">A multi-line text area.</textarea>
</div>
<div class="checkboxContainer checkboxContainer-withDescription">
    <label class="emby-checkbox-label">
        <input type="checkbox" is="emby-checkbox" id="chkEnabled" checked />
        <span class="checkboxLabel">Enabled</span>
    </label>
    <div class="fieldDescription checkboxFieldDescription">Keeps the settings and skips this server while off.</div>
</div>
<h3 class="stolon-subsection-title">Built from code</h3>
<div id="built"></div>
<script type="module">
const base = await window.__baseReady;
const built = document.getElementById('built');
[
    base.createInputField({ label: 'Port', type: 'number', min: 1, max: 65535, value: 8096, help: 'The port it listens on.' }),
    base.createSelectField({ label: 'Mode', options: [{ value: 'Allow', text: 'Allowlist' }, { value: 'Block', text: 'Blocklist' }], value: 'Block', help: 'Which list the rules form.' }),
    base.createTextareaField({ label: 'Hosts', value: ['a.example', 'b.example'], help: 'One host per line.' }),
    base.createSecretField({ label: 'API token', stored: true, help: 'The token the server signs in with.' }),
    base.createCheckboxField({ label: 'Notify on failure', help: 'Sends a message when a run fails.', checked: true })
].forEach((field) => built.appendChild(field.element));
base.bindFieldAdornments(built);
</script>
