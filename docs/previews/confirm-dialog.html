<!-- title: Confirm Dialog -->
<!-- min-height: 360 -->
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
    <button type="button" id="btnRemove" class="raised stolon-button stolon-destructive"><span>Remove server</span></button>
    <button type="button" id="btnDelete" class="raised stolon-button stolon-destructive"><span>Delete database</span></button>
</div>
<span id="confirmStatus" class="stolon-status-text"></span>
<script type="module">
const base = await window.__baseReady;
const shared = base.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');
shared.bindClick('btnRemove', () => {
    base.confirmDialog('Its links stop playing. Downloaded files stay.', {
        title: 'Remove Den',
        confirmText: 'Remove',
        destructive: true
    }).then((confirmed) => shared.setStatus('confirmStatus', confirmed ? 'Removed.' : 'Kept.', !confirmed, { timeout: 0 }));
});
// A typed confirm keeps Delete off until the field holds the exact text.
shared.bindClick('btnDelete', () => {
    base.confirmDialog('Every link in it goes, and this cannot be undone.', {
        title: 'Delete the sync database',
        confirmText: 'Delete',
        destructive: true,
        typeToConfirm: 'Database'
    }).then((confirmed) => shared.setStatus('confirmStatus', confirmed ? 'Deleted.' : 'Kept.', !confirmed, { timeout: 0 }));
});
</script>
