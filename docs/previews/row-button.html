<!-- title: Row Button -->
<div style="display: flex; gap: 8px; align-items: center;">
    <button type="button" class="stolon-row-btn" title="Edit"><span class="material-icons">edit</span></button>
    <button type="button" class="stolon-row-btn stolon-save" title="Save"><span class="material-icons">save</span></button>
    <button type="button" class="stolon-row-btn stolon-success" title="Saved"><span class="material-icons">check</span></button>
    <button type="button" class="stolon-row-btn stolon-dirty" title="Unsaved change"><span class="material-icons">save</span></button>
</div>
