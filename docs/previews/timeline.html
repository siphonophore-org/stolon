<!-- title: Timeline -->
<div id="mount" style="display: grid; gap: 24px;"></div>
<script type="module">
const base = await window.__baseReady;
const mount = document.getElementById('mount');
mount.appendChild(base.createTimeline({ items: [
    { time: '10:00', datetime: '2026-03-10T10:00', title: 'Sync started', body: 'Two servers in the pool.', status: 'purple', icon: 'sync' },
    { time: '10:04', title: 'Library synced', body: '1,204 items.', status: 'green', icon: 'check' },
    { time: '10:07', title: 'Could not reach a server', status: 'red' }
] }).element);
mount.appendChild(base.createTimeline({ items: [
    { time: 'Yesterday', title: 'Ada', body: 'Could you add the extended cut?', avatar: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#aa5cc3"/><circle cx="20" cy="16" r="7" fill="#f3d9fa"/><rect x="8" y="26" width="24" height="14" rx="7" fill="#f3d9fa"/></svg>'), avatarLabel: 'Ada' },
    { time: 'Today', title: 'Bob', body: 'Approved. It is on its way.', avatar: '', avatarLabel: 'Bob' }
] }).element);
</script>
