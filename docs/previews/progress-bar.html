<!-- title: Progress Bar -->
<div class="stolon-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-label="Download">
    <div class="stolon-progress-bar" style="width: 40%"></div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 16px;">
    <button type="button" class="raised stolon-button stolon-primary stolon-btn-progress-host"><span>Run 55%</span><div class="stolon-progress-bar stolon-btn-progress" style="width: 55%"></div></button>
    <button type="button" class="raised stolon-button stolon-destructive stolon-btn-progress-host"><span>Remove 55%</span><div class="stolon-progress-bar stolon-btn-progress" style="width: 55%"></div></button>
    <button type="button" class="raised stolon-button stolon-secondary stolon-large stolon-btn-progress-host"><span>Scan 55%</span><div class="stolon-progress-bar stolon-btn-progress" style="width: 55%"></div></button>
    <span style="display: inline-flex; align-items: center;"><button type="button" class="raised stolon-button stolon-primary stolon-small"><span>Refresh 55%</span></button><span class="stolon-ring stolon-ring-small stolon-ring-pie stolon-btn-progress-pie" role="progressbar" aria-label="Refresh" aria-valuemin="0" aria-valuemax="100" aria-valuenow="55"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="stolon-ring-track" cx="18" cy="18" r="9" fill="none" pathLength="100"></circle><circle class="stolon-ring-arc" cx="18" cy="18" r="9" fill="none" pathLength="100" stroke-dasharray="55 100"></circle></svg></span></span>
</div>
