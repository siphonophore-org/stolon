<!-- title: Dialog -->
<!-- min-height: 420 -->
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
    <button type="button" id="btnCompact" class="raised stolon-button stolon-primary"><span>Compact</span></button>
    <button type="button" id="btnFull" class="raised stolon-button stolon-secondary"><span>Full</span></button>
</div>
<span id="dialogStatus" class="stolon-status-text"></span>
<script type="module">
const base = await window.__baseReady;
const shared = base.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');
shared.bindClick('btnCompact', () => base.openDialog({
    title: 'Sync paused',
    description: 'Server B stopped answering. Zooid tries again in five minutes.',
    buttons: [{ text: 'OK', className: 'stolon-button stolon-primary', value: 'ok' }],
    onClose: (value) => shared.setStatus('dialogStatus', 'Closed with ' + (value || 'a dismissal') + '.', false, { timeout: 0 })
}));
// A full dialog's context is fed in, here a poster and the name of what is deleted.
shared.bindClick('btnFull', () => {
    const context = document.createElement('div');
    context.style.cssText = 'display: flex; gap: 12px; align-items: center;';
    context.innerHTML = '<div style="width: 48px; height: 72px; border-radius: 4px; background: #444;"></div>' +
        '<div><div style="font-weight: 600;">Charade (1963).mkv</div><div style="opacity: .7;">Movies, 1.2 GB</div></div>';
    base.openDialog({
        title: 'Delete Charade',
        subtitle: 'The file goes from this server and stops syncing.',
        context: context,
        buttons: [
            { text: 'Cancel', className: 'stolon-button stolon-secondary', value: 'cancel' },
            { text: 'Delete', className: 'stolon-button stolon-destructive', value: 'delete' }
        ],
        onClose: (value) => shared.setStatus('dialogStatus', 'Closed with ' + (value || 'a dismissal') + '.', false, { timeout: 0 })
    });
});
</script>
