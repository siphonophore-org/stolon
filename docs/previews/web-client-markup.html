<!-- title: Web Client Markup -->
<p>The markup each builder returns. The web client's stylesheets draw it, and they are not here, so the preview shows the markup as text.</p>
<label for="builder">Builder</label>
<select id="builder"></select>
<pre id="markup" style="white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--stolon-mono); font-size: var(--stolon-font-small);"></pre>
<script type="module">
const base = await window.__baseReady;
const samples = {
    webCard: () => base.webCard({ title: 'Example Movie', type: 'Movie', secondary: '2010', indicator: { icon: 'check', title: 'Played' } }),
    webMenuItem: () => base.webMenuItem(base.webIcon('Settings'), 'Settings', 'web/#/mypreferencesmenu'),
    webConfirmDialogFooter: () => base.webConfirmDialogFooter('Delete', 'delete'),
    webCheckbox: () => base.webCheckbox({ id: 'season1' }, 'Season 1', 'In the library', true, true),
    webSelectField: () => base.webSelectField('sort', 'Sort by', [{ value: 'name', text: 'Name' }, { value: 'date', text: 'Date added' }]),
    webEmptyState: () => base.webEmptyState('Nothing here', 'Add one to start.'),
    webDetailStatus: () => base.webDetailStatus('schedule', 'Waiting for approval'),
    webNoteRow: () => base.webNoteRow({ title: 'No sound', secondary: 'Today', asideHtml: base.webStatusTag('Open'), by: 'Ana', notes: [{ by: 'Bo', text: 'Fixed in the new copy.' }] }),
    webOverlayButton: () => base.webOverlayButton({ action: 'request', icon: 'add', title: 'Request', label: 'Request Example Movie (2010)' }, 'hover'),
    openWebDialog: () => {
        const dialog = base.openWebDialog({ look: 'message', title: 'Delete Den', text: 'The invite stops working.', buttons: [{ id: 'dialogCancel', text: 'Cancel' }, { id: 'dialogSubmit', text: 'Delete', type: 'delete' }] });
        const html = dialog.container.outerHTML;
        dialog.close();
        return html;
    },
    webLimitsBox: () => base.webLimitsBox('Limits', [{ label: 'Movies', amount: '2 of 5 left', percent: 60 }, { label: 'Shows', amount: '0 of 2 left', percent: 100 }])
};
const select = document.getElementById('builder');
const out = document.getElementById('markup');
Object.keys(samples).forEach(function (name) {
    const option = document.createElement('option');
    option.value = name;
    option.textContent = name;
    select.appendChild(option);
});
function show() { out.textContent = samples[select.value]().replace(/></g, '>\n<'); }
select.addEventListener('change', show);
show();
</script>
